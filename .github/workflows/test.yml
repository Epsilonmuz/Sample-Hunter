name: Test

# Every push: build, then run the headless iPhone-size test bench (demo hunt, file import, live mic with a fake
# device, kit, beat timing, ZIP export). GitHub Pages serves docs/ straight from main.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build
        run: python3 build.py
      - name: Test (headless Chrome, iPhone size)
        run: |
          npm install --no-save playwright@1.63.0
          sed -i "s#executablePath: '/usr/bin/google-chrome', ##" tests/test.mjs
          npx playwright install --with-deps chromium
          node tests/test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shots }
