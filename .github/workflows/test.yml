name: Test

# Every push: build, then run the headless iPhone-size test bench (demo hunt, file import, live mic with a fake
# device, kit, beat timing, ZIP export). GitHub Pages serves docs/ straight from main.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build
        run: python3 build.py
      - name: Test (headless Chrome, iPhone size)
        run: |
          npm install --no-save playwright@1.63.0
          sed -i "s#executablePath: '/usr/bin/google-chrome', ##" tests/test.mjs
          npx playwright install --with-deps chromium
          node tests/test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shots }

  # The iPhone app: builds the Xcode project, installs it on an iPhone simulator, launches it and takes a screenshot.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bundle the page into the app
        run: python3 build.py
      - name: Build for the iPhone simulator
        run: |
          xcodebuild -version
          xcodebuild -project ios/SampleHunter.xcodeproj -scheme SampleHunter -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test -d build/Build/Products/Debug-iphonesimulator/SampleHunter.app
      - name: Build for a real iPhone (unsigned, proves the device build compiles)
        run: |
          xcodebuild -project ios/SampleHunter.xcodeproj -scheme SampleHunter -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Launch on a simulator and take a screenshot
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,v in sorted(d.items(), reverse=True) if 'iOS' in r for x in v if x['name'].startswith('iPhone')))")
          echo "simulator $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/SampleHunter.app
          xcrun simctl launch "$DEV" com.epsilonsounds.samplehunter
          sleep 12
          mkdir -p ios-shots
          xcrun simctl io "$DEV" screenshot ios-shots/launch.png
          # still running after 12 s = no crash on launch
          xcrun simctl spawn "$DEV" launchctl list | grep -q com.epsilonsounds.samplehunter
          # a small copy of the screenshot in the log (readable without downloading artifacts)
          sips -s format jpeg -s formatOptions 60 -Z 700 ios-shots/launch.png --out ios-shots/launch-small.jpg >/dev/null
          echo "SCREENSHOT-BEGIN"; base64 -i ios-shots/launch-small.jpg | tr -d '\n'; echo; echo "SCREENSHOT-END"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-simulator, path: ios-shots }
