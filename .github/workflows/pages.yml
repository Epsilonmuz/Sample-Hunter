name: Test and publish

# Every push: build, run the headless iPhone-size test bench (demo hunt, file import, live mic with a fake
# device, kit, beat timing, ZIP export), then publish docs/ to GitHub Pages.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build
        run: python3 build.py
      - name: Test (headless Chrome, iPhone size)
        run: |
          npm install --no-save playwright@1.63.0
          sed -i "s#executablePath: '/usr/bin/google-chrome', ##" tests/test.mjs
          npx playwright install --with-deps chromium
          node tests/test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shots }

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deployment
        uses: actions/deploy-pages@v4
